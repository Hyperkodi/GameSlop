<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1280" viewBox="-18 -12 198.4 124" role="img" aria-labelledby="title desc">
  <title id="title">m01 production art guide</title>
  <desc id="desc">Fixed 16:10 camera guide. Green is safe scenery. Red is the calm route corridor. Blue circles are pad clear zones. This image is not player-facing art.</desc>
  <rect x="-18" y="-12" width="198.4" height="124" fill="#143f37"/>
  <rect x="0" y="0" width="160" height="100" fill="#245f4f" stroke="#f7f0d7" stroke-width="0.8"/>
  <g id="quiet-corridors" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline id="calm-lane.migrated.route.main" points="-6,22 46,22 46,74 114,74 114,38 166,38" stroke="#ff4268" stroke-width="16" opacity="0.44" data-layer="surface"/>
    <polyline id="tactical-lane.migrated.route.main" points="-6,22 46,22 46,74 114,74 114,38 166,38" stroke="#ff9a3c" stroke-width="12" opacity="0.66"/>
    <polyline id="visual-core-lane.migrated.route.main" points="-6,22 46,22 46,74 114,74 114,38 166,38" stroke="#fff4a8" stroke-width="8" opacity="0.92"/>
  </g>
  <g id="pad-clear-zones" fill="#36c8ff" fill-opacity="0.34" stroke="#bceeff" stroke-width="0.65" font-family="system-ui,Segoe UI,sans-serif" font-size="2.4" text-anchor="middle">
    <circle id="pad-clear-p01" cx="14" cy="38" r="10"/>
    <text x="14" y="38.7" fill="#06131a">p01</text>
    <circle id="pad-clear-p02" cx="62" cy="34" r="10"/>
    <text x="62" y="34.7" fill="#06131a">p02</text>
    <circle id="pad-clear-p03" cx="30" cy="58" r="10"/>
    <text x="30" y="58.7" fill="#06131a">p03</text>
    <circle id="pad-clear-p04" cx="66" cy="58" r="10"/>
    <text x="66" y="58.7" fill="#06131a">p04</text>
    <circle id="pad-clear-p05" cx="62" cy="90" r="10"/>
    <text x="62" y="90.7" fill="#06131a">p05</text>
    <circle id="pad-clear-p06" cx="82" cy="90" r="10"/>
    <text x="82" y="90.7" fill="#06131a">p06</text>
    <circle id="pad-clear-p07" cx="102" cy="90" r="10"/>
    <text x="102" y="90.7" fill="#06131a">p07</text>
    <circle id="pad-clear-p08" cx="98" cy="54" r="10"/>
    <text x="98" y="54.7" fill="#06131a">p08</text>
    <circle id="pad-clear-p09" cx="126" cy="22" r="10"/>
    <text x="126" y="22.7" fill="#06131a">p09</text>
    <circle id="pad-clear-p10" cx="146" cy="54" r="10"/>
    <text x="146" y="54.7" fill="#06131a">p10</text>
  </g>
  <g id="anchors" font-family="system-ui,Segoe UI,sans-serif" font-size="2.2" font-weight="700">
    <g id="anchor-entry.west" data-kind="entry">
      <circle cx="-6" cy="22" r="2.8" fill="#ffffff" stroke="#071018" stroke-width="0.8"/>
      <text x="-6" y="17.7" fill="#ffffff" stroke="#071018" stroke-width="0.6" paint-order="stroke">entry.west</text>
    </g>
    <g id="anchor-gate.east" data-kind="gate">
      <circle cx="166" cy="38" r="2.8" fill="#ffffff" stroke="#071018" stroke-width="0.8"/>
      <text x="166" y="33.7" fill="#ffffff" stroke="#071018" stroke-width="0.6" paint-order="stroke">gate.east</text>
    </g>
  </g>
  <g transform="translate(-14.5 -5.5)" font-family="system-ui,Segoe UI,sans-serif" fill="#ffffff" font-size="2.5">
    <rect x="0" y="-4.5" width="79" height="8" rx="1.5" fill="#071018" opacity="0.9"/>
    <text x="2" y="0">GREEN scenery / RED quiet / BLUE pads / WHITE anchors</text>
  </g>
