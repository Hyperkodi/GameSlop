<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1280" viewBox="-18 -12 198.4 124" role="img" aria-labelledby="title desc">
  <title id="title">m05 production art guide</title>
  <desc id="desc">Fixed 16:10 camera guide. Green is the landmark-safe base outside overlaid clearances. Red is the ground-route calm corridor. Dashed cyan marks air clearance. Blue circles are neutral pad clear zones. Teal markers are joins. This image is not player-facing art.</desc>
  <rect x="-18" y="-12" width="198.4" height="124" fill="#143f37"/>
  <rect id="safe-landmark-zone-board" x="0" y="0" width="160" height="100" fill="#245f4f" stroke="#f7f0d7" stroke-width="0.8" data-guide-only="true"/>
  <g id="quiet-corridors" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline id="calm-lane.spiral" points="-6,18 146,18 146,86 22,86 22,50 106,50" stroke="#ff4268" stroke-width="16" opacity="0.44" data-layer="surface"/>
    <polyline id="tactical-lane.spiral" points="-6,18 146,18 146,86 22,86 22,50 106,50" stroke="#ff9a3c" stroke-width="12" opacity="0.66"/>
    <polyline id="visual-core-lane.spiral" points="-6,18 146,18 146,86 22,86 22,50 106,50" stroke="#fff4a8" stroke-width="8" opacity="0.92"/>
  </g>
  <g id="pad-clear-zones" fill="#36c8ff" fill-opacity="0.34" stroke="#bceeff" stroke-width="0.65" font-family="system-ui,Segoe UI,sans-serif" font-size="2.4" text-anchor="middle" data-guide-only="true" data-semantic="neutral-clear-disk">
    <circle id="pad-clear-p01" cx="14" cy="34" r="10"/>
    <text x="14" y="34.7" fill="#06131a">p01</text>
    <circle id="pad-clear-p02" cx="34" cy="34" r="10"/>
    <text x="34" y="34.7" fill="#06131a">p02</text>
    <circle id="pad-clear-p03" cx="54" cy="34" r="10"/>
    <text x="54" y="34.7" fill="#06131a">p03</text>
    <circle id="pad-clear-p04" cx="74" cy="34" r="10"/>
    <text x="74" y="34.7" fill="#06131a">p04</text>
    <circle id="pad-clear-p05" cx="94" cy="34" r="10"/>
    <text x="94" y="34.7" fill="#06131a">p05</text>
    <circle id="pad-clear-p06" cx="118" cy="34" r="10"/>
    <text x="118" y="34.7" fill="#06131a">p06</text>
    <circle id="pad-clear-p07" cx="38" cy="70" r="10"/>
    <text x="38" y="70.7" fill="#06131a">p07</text>
    <circle id="pad-clear-p08" cx="58" cy="70" r="10"/>
    <text x="58" y="70.7" fill="#06131a">p08</text>
    <circle id="pad-clear-p09" cx="78" cy="70" r="10"/>
    <text x="78" y="70.7" fill="#06131a">p09</text>
    <circle id="pad-clear-p10" cx="98" cy="70" r="10"/>
    <text x="98" y="70.7" fill="#06131a">p10</text>
    <circle id="pad-clear-p11" cx="118" cy="70" r="10"/>
    <text x="118" y="70.7" fill="#06131a">p11</text>
    <circle id="pad-clear-p12" cx="130" cy="54" r="10"/>
    <text x="130" y="54.7" fill="#06131a">p12</text>
  </g>
  <g id="anchors" font-family="system-ui,Segoe UI,sans-serif" font-size="2.2" font-weight="700">
    <g id="anchor-entry.west" data-kind="entry">
      <circle cx="-6" cy="18" r="2.8" fill="#ffffff" stroke="#071018" stroke-width="0.8"/>
      <text x="-6" y="13.7" fill="#ffffff" stroke="#071018" stroke-width="0.6" paint-order="stroke">entry.west</text>
    </g>
    <g id="anchor-gate.core" data-kind="gate">
      <circle cx="106" cy="50" r="2.8" fill="#ffffff" stroke="#071018" stroke-width="0.8"/>
      <text x="106" y="45.7" fill="#ffffff" stroke="#071018" stroke-width="0.6" paint-order="stroke">gate.core</text>
    </g>
  </g>
  <g transform="translate(-14.5 -5.5)" font-family="system-ui,Segoe UI,sans-serif" fill="#ffffff" font-size="2.5">
    <rect x="0" y="-4.5" width="79" height="8" rx="1.5" fill="#071018" opacity="0.9"/>
    <text x="2" y="0">GREEN landmark-safe / RED quiet / BLUE pads / TEAL joins / WHITE anchors</text>
  </g>
</svg>
