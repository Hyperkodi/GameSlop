<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BitDog — Campaign scenery review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#faf4e6;color:#343e2d;font:15px/1.6 system-ui}main{max-width:1280px;margin:auto;padding:28px 20px}h1{font-size:clamp(24px,4vw,38px)}nav,.controls,footer{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:20px 0}a{color:#3e633c}button,select{font:inherit;padding:10px;border-radius:8px;border:1px solid #afb9a0;background:#fff9ed;color:#343e2d}input[type=range]{width:min(420px,65vw)}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}canvas,img{display:block;width:100%;height:auto;border:1px solid #b8c2a8;border-radius:9px}h2{font-size:16px}.proof{padding:15px;background:#e4ead8;border-radius:8px}.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px}.props img{background:repeating-conic-gradient(#c3bba9 0% 25%,#e6decd 0% 50%) 50%/24px 24px;max-height:220px;object-fit:contain}figure{margin:0}figcaption{font-size:12px}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style></head>
<body><main><nav><a id="play" href="../">← Play BitDog</a><label>Scenery <select id="level"></select></label></nav><h1 id="title">Eight impossible fetches</h1><p>Move the camera to compare the original panorama with its assembled tiles. The shared edges use identical source pixels.</p>
<div class="controls"><button id="scroll">Auto-scroll</button><label>Camera <input id="camera" type="range" min="0" max="22000" value="0"></label><label><input id="boundaries" type="checkbox"> Show tile joins</label><output id="position">0</output></div>
<div class="pair"><div><h2>Original panorama</h2><canvas id="master" width="960" height="540"></canvas></div><div><h2>Assembled tiles</h2><canvas id="assembled" width="960" height="540"></canvas></div></div><p class="proof" id="proof">Loading verification…</p>
<h2>Full panorama</h2><img id="panorama" alt="Level panorama"><h2>Coin flight scenery</h2><img id="pov" alt="The owner's view into the same level"><h2>Interactive scenery</h2><div class="props" id="props"></div><footer id="sources"></footer></main>
<script src="../js/levels.js"></script><script src="../js/environment.js"></script><script>
(async()=>{
 const themes=['environment','orchard','electric','moonwood','snow','carnival','moon','backyard'],select=document.querySelector('#level');
 for(const l of BitDogLevels.catalog){const o=new Option(`${l.id}. ${l.name}`,l.id);select.add(o);}const id=Math.max(1,Math.min(8,Number(new URLSearchParams(location.search).get('level'))||4));select.value=id;
 select.onchange=()=>{location.search='?level='+select.value;};const folder=themes[id-1],base=folder+'/';
 document.querySelector('#title').textContent=BitDogLevels.get(id).name;document.querySelector('#play').href='../?level='+id;
 const manifest=await fetch(base+'manifest.json').then(r=>{if(!r.ok)throw Error('Missing panorama manifest');return r.json();});
 const load=file=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=base+file;});
 const [master,...tiles]=await Promise.all([load(manifest.master),...manifest.tiles.map(t=>load(t.file))]);
 document.querySelector('#panorama').src=base+manifest.master;document.querySelector('#pov').src=base+(id===1?'satoshi-park-pov-v1.png':'pov-v1.png');
 document.querySelector('#proof').textContent=`${manifest.width} × ${manifest.height} pixels. ${manifest.tiles.length} tiles with ${manifest.overlap} pixels of shared overlap. The panorama is finite: the last tile does not wrap to the first.`;
 for(const [kind,a]of Object.entries(manifest.assets||{})){const fig=document.createElement('figure'),image=new Image(),label=document.createElement('figcaption');image.src=base+a.file;image.alt=kind;label.textContent=kind;fig.append(image,label);document.querySelector('#props').append(fig);}
 for(const [label,file]of [['Tile coordinates','manifest.json'],['Pixel verification','seam-verification.json'],['Art production','PRODUCTION.md']]){const a=document.createElement('a');a.href=base+file;a.textContent=label;document.querySelector('#sources').append(a);}
 const canvases=['master','assembled'].map(id=>document.getElementById(id)),slider=document.querySelector('#camera'),joins=document.querySelector('#boundaries');let auto=false,prev=performance.now(),pos=0;
 function draw(){const p=BitDogEnvironment.layout(manifest,960,540,pos);canvases.forEach((canvas,i)=>{const c=canvas.getContext('2d');c.clearRect(0,0,960,540);if(i===0)c.drawImage(master,-p.offset,p.y,manifest.width*p.scale,manifest.height*p.scale);else for(const tile of p.visible)c.drawImage(tiles[tile.index],tile.x,tile.y,tile.w,tile.h);if(joins.checked&&i===1){c.strokeStyle='#fff4b3';c.lineWidth=2;c.setLineDash([8,5]);for(const tile of p.visible){if(tile.index===0)continue;c.beginPath();c.moveTo(tile.x,0);c.lineTo(tile.x,540);c.stroke();}c.setLineDash([]);}});document.querySelector('#position').textContent=Math.round(pos);}
 slider.oninput=()=>{pos=Number(slider.value);draw();};joins.onchange=draw;document.querySelector('#scroll').onclick=()=>{auto=!auto;document.querySelector('#scroll').textContent=auto?'Stop scrolling':'Auto-scroll';};function frame(now){if(auto){pos=(pos+Math.min(now-prev,50)*.5)%22000;slider.value=pos;draw();}prev=now;requestAnimationFrame(frame);}draw();document.body.dataset.ready='1';requestAnimationFrame(frame);
})().catch(error=>{document.querySelector('#proof').textContent=error.message;});
</script></body></html>
